<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Desperfectos RM</title>
    <style>
        :root {
        --fondo-pantalla: #f6f5f1;   
        --fondo-tarjeta: #ffffff;    
        --texto-principal: #1b2430;  
        --texto-secundario: #667085; 
        --amarillo-vial: #ffc20e;    
        --texto-sobre-amarillo: #1b2430;
        }
        @media (prefers-color-scheme: dark) {
        :root {
            --fondo-pantalla: #0e1217;
            --fondo-tarjeta: #171c23;
            --texto-principal: #f2f3f5;
            --texto-secundario: #9aa1ad;
        }
        
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    }
        *{
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--fondo-pantalla);
            color: var(--texto-principal);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>
<body>
    {# Avisos cortos: "Tu reporte quedo registrado", errores de login, etc. #}
    {% if messages %}
        {% for message in messages %}
            <div style="padding: 13px 18px; background-color: var(--amarillo-vial);
                        color: var(--texto-sobre-amarillo); font-size: 15px;
                        text-align: center;">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block contenido %}
    {% endblock contenido%}
</body>
</html>
