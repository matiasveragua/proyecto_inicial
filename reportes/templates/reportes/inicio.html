{% extends 'reportes/base.html'%}

{% block contenido %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    .back-map {
        flex: 1;
        position: relative;
    }

    .inferior-panel {
        background-color: var(--fondo-pantalla);
        border-radius: 26px 26px 0 0 ;
        box-shadow: o -10px 30px rgba(0,0,0,0.5);
        padding: 20px;
        position: relative;
        z-index: 2000;
        margin-top: -30px;
    }
    .principal-btn {
        background-color: var(--amarillo-vial);
        color: var(--texto-sobre-amarillo);
        border: none;
        width: 100%;
        height: 52px;
        border-radius: 16px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .sec-btn {
        background-color: transparent;
        color: var(--color-sec-btn);
        border: none;
        width: 100%;
        height: 44px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
    }
    .catch-line {
        width: 38px;
        height: 5px;
        background-color: var(--texto-secundario);
        border-radius: 3px;
        margin: 0 auto 15px auto; 
        opacity: 0.5;
    }
    .float-txt {
        position: absolute;
        top: 52px;
        left: 16px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 6px 14px 6px 6px;
        border-radius: 20px;
        background-color: var(--fondo-tarjeta); 
        color: var(--texto-principal);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 6px 18px -8px rgba(0,0,0,0.3);
    
    }
    .user-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background-color: var(--fondo-pantalla);
        color: var(--amarillo-vial);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: bold;
    }
    .status-txt {
        display: flex;
        gap: 14px;
        font-size: 12.5px;
        color: var(--texto-secundario);
        margin-top: 5px;
        margin-bottom: 20px;
    }
    .status-light {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 5px;
    }

</style>
<!-- Zona superior (El mapa) -->
<div class="back-map">
    
    <!-- El lienzo donde Leaflet dibujará las calles reales -->
    <div id="mi-mapa" style="width: 100%; height: 100%;"></div>
    
    <!-- Tu saludo flotante se mantiene intacto -->
    <div class="float-txt" style="position: absolute; top: 52px; left: 16px; z-index: 1000;">
        <span class="user-avatar">M</span>
        <b style="font-size: 15px;">Hola, Matías</b>
    </div>

</div>

<!-- Zona inferior (El menú) -->
<div class="inferior-panel">
    <div class="catch-line"></div>
    <h2 style="margin: 0; font-size: 22px;">Cerca de ti</h2>
    
    <!-- Aquí reemplazamos el "12" fijo por la variable de Django -->
    <p style="color: var(--texto-secundario); font-size: 14px;">{{ cantidad_reportes|default:"0" }} reportes en tu zona esta semana</p>
    <div class="status-txt">
        <span><i class="status-light" style="background-color: var(--amarillo-vial);"></i>Recibido</span>
        <span><i class="status-light" style="background-color: #f08a24;"></i>En revisión</span>
        <span><i class="status-light" style="background-color: #2fa66a;"></i>Resuelto</span>
    </div>
    <button class="principal-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
        </svg>
        Reportar desperfecto
    </button>
    
    <!-- Botón fantasma -->
    <button class="sec-btn">Mis reportes</button>
</div>
<script>
    // 1. Inicializar el mapa y centrarlo en Santiago (Latitud, Longitud, Nivel de Zoom)
    var mapa = L.map('mi-mapa', {
        zoomControl: false // Oculta los botones +/- para que parezca app nativa
    }).setView([-33.4489, -70.6693], 14);

    // 2. Cargar el diseño premium oscuro de las calles
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'

    }).addTo(mapa);
    // 4. Dibujar el punto azul de "Mi Ubicación"
    L.circleMarker([-33.4489, -70.6693], {
        color: '#ffffff',
        weight: 3,
        fillColor: '#3478f6',
        fillOpacity: 1,
        radius: 7
    }).addTo(mapa);
</script>
{% endblock contenido %}
